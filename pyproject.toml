[project]
name = "voicebot"
version = "0.1.0"
description = "Multilingual Vernacular Voicebot with RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Orchestration + observability
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    # Retrieval / RAG (BM25, vector store, embeddings, reranker, segmentation)
    "bm25s>=0.2.0",
    "docling>=2.9.0",
    "faiss-cpu>=1.9.0",
    "indic-nlp-library>=0.92",
    "PyStemmer>=2.2.0",
    "sentence-transformers>=3.0.0",
    "soundfile>=0.12.1",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.46.0",
    # Backend / API
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
    # Data + PDF parsing
    "numpy>=2.0.0",
    "pandas>=3.0.2",
    "pyarrow>=17.0.0",
    # Persistence (Postgres checkpointer + session metadata)
    "alembic>=1.18.5",
    "asyncpg>=0.29.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pypika>=0.51.1",
    "structlog>=24.0.0",
    # RAG evaluation (RAGAS + Ollama-hosted Gemma judge)
    "datasets>=3.0.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "ragas>=0.2.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0.12.20260510",
    "tavern>=3.6.1",
    "types-tqdm>=4.68.0.20260608",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Pin torch to the CUDA 12.8 wheel index. Default PyPI now ships +cu130 wheels,
# which need an NVIDIA driver >= 580; hosts on the 570 driver (CUDA 12.8) load
# them CPU-only with a "driver too old" warning. cu128 matches the 570 driver.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# torchvision (pulled in by docling) must come from the SAME cu128 index as
# torch, or its compiled ops ABI-mismatch torch ("operator torchvision::nms
# does not exist"). Keep it pinned alongside torch.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
# assert / hardcoded-fixture-value warnings are expected in test code.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["alembic/", "services/"]
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "indicnlp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: RAGAS regression - manual only, requires a running Ollama + testset",
]
addopts = "-m 'not eval'"

[tool.coverage.run]
source = ["src"]
