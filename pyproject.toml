[project]
name = "voicebot"
version = "0.1.0"
description = "Multilingual Vernacular Voicebot with RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Observability (LangSmith tracing — imported directly by src/utils/observability.py)
    "langsmith>=0.1.0",
    # Vector store
    "faiss-cpu>=1.9.0",
    # Lexical / BM25 search
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    # Sentence segmentation (multilingual)
    "indic-nlp-library>=0.92",
    # Embeddings + models (incl. CrossEncoder reranker)
    "sentence-transformers>=3.0.0",
    "transformers>=4.46.0",
    "torch>=2.4.0",
    "soundfile>=0.12.1",
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    # Data
    "pandas>=3.0.2",
    "pyarrow>=17.0.0",
    "numpy>=2.0.0",
    # PDF parsing
    "pymupdf>=1.24.0",
    "httpx>=0.28.1",
    # Persistence (Postgres checkpointer + session metadata)
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "asyncpg>=0.29.0",
    "pypika>=0.51.1",
    "alembic>=1.18.5",
    "structlog>=24.0.0",
    # RAG evaluation (RAGAS + Ollama-hosted Gemma judge)
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-community>=0.3.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0.12.20260510",
    "tavern>=3.6.1",
    "headroom-ai[all]>=0.30.0",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
# assert / hardcoded-fixture-value warnings are expected in test code.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["alembic/", "services/"]

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: RAGAS regression - manual only, requires a running Ollama + testset",
]
addopts = "-m 'not eval'"

[tool.coverage.run]
source = ["src"]
