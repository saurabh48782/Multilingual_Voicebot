api:
  host: "${API_HOST:-0.0.0.0}"
  port: "${API_PORT:-8000}"
  debug: "${DEBUG:-false}"

observability:
  langsmith:
    enabled: "${LANGSMITH_TRACING:-false}"   # true → export every graph turn to LangSmith
    api_key: "${LANGSMITH_API_KEY:-}"
    project: "${LANGSMITH_PROJECT:-voicebot}"
    endpoint: "${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}"

llm:
  provider: "ollama"
  model: "gemma4:12b"
  # Optional: pin the groundedness verifier to a different model (ideally a
  # different family than `model`, e.g. a Qwen/Llama model) so generator and
  # judge don't share the same hallucination failure modes. Unset = verifier
  # reuses `model`.
  # verifier_model: "qwen2.5:14b"
  ollama_base_url: "http://localhost:11434"
  think_on_generate: true
  num_ctx: 8192

translation:
  provider: "ollama"
  ollama_model: "translategemma:12b"

rag:
  embedding_model: "intfloat/multilingual-e5-large"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  retrieval_threshold: 0.65
  retrieval_gap_threshold: 0.03
  top_k: 5
  retrieval:
    bm25_top_n: 20
    vector_top_n: 20
    rrf_k: 60
    use_reranker: true
    rerank_batch_size: 16
    # Gate thresholds for the no-reranker branch. RRF scores are normalised
    # (top is always 1.0) so they need their own scale - the reranker
    # thresholds above operate on absolute sigmoid scores instead.
    rrf_threshold: 0.5
    rrf_gap_threshold: 0.05
  chunking:
    strategy: "semantic"          # "semantic" | "paragraph"
    breakpoint_percentile: 90     # cosine-distance percentile that triggers a split
    min_chunk_size: 300           # chars - smaller chunks get merged
    max_chunk_size: 1500          # chars - bigger semantic groups are sub-split
    overlap_sentences: 2          # trailing sentences prepended to next chunk

stt:
  provider: "indic_conformer"
  decode_strategy: "rnnt"              # rnnt (accurate) | ctc (faster)
  remote_url: "${STT_REMOTE_URL:-}"    # stt_conformer sidecar URL (required; compose sets http://stt:8002)

tts:
  provider: "indic_parler"
  description: "A clear, calm voice speaks at a natural, moderate pace in a quiet environment. The recording is very high quality, with the voice sounding close-up and natural, with no background noise."
  remote_url: "${TTS_REMOTE_URL:-}"   # tts_parler sidecar URL (required; compose sets http://tts:8001)

audio:
  cache_ttl_seconds: 3600
  cache_max_files: 1000

memory:
  checkpoint_dsn: "${CHECKPOINT_DSN:-}"

evaluation:
  # Decorrelate the judge from the generator: ideally a DIFFERENT model family
  # than llm.model so the judge doesn't share the generator's failure modes
  # (a hallucination the generator makes, a same-family judge tends to rate as
  # faithful). ragas_eval warns when this equals llm.model. GPU budget is
  # committed to Gemma by default, so this stays gemma4:12b until a second
  # family can be co-hosted; override to e.g. qwen2.5:14b when it can.
  judge_model: "gemma4:12b"          # Ollama judge (shares llm.ollama_base_url)
  embedding_model: "intfloat/multilingual-e5-large"
  judge_temperature: 0.0
  # Eval generation mirrors the production `generate` node (temp 0.3 + native
  # thinking when llm.think_on_generate) so reported metrics reflect real traffic.
  sample_strategy: "random"          # "random" | "head" — how --sample-size picks rows
  sample_seed: 42
  testset:
    path: "data/eval/testset.jsonl"
    size: 50
    languages: ["en", "hi", "bn"]    # synthesize Qs in English then translate to vernaculars
    query_distribution:
      simple: 0.5
      reasoning: 0.25
      multi_context: 0.25
  metrics:
    - context_precision
    - context_recall
    - faithfulness
    - answer_relevancy
    - answer_correctness
    - answer_similarity
  thresholds:
    context_precision: 0.70
    context_recall: 0.70
    faithfulness: 0.80
    answer_relevancy: 0.75
    answer_correctness: 0.60
    answered_rate: 0.70              # min fraction of rows that must produce a grounded answer
  report_dir: "data/eval/reports"
  max_workers: 4
