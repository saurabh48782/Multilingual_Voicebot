api:
  host: "${API_HOST:-0.0.0.0}"
  port: "${API_PORT:-8000}"
  debug: "${DEBUG:-false}"

db:
  host: "${POSTGRES_HOST:-127.0.0.1}"
  port: "${POSTGRES_PORT:-5433}"
  user: "${POSTGRES_USER:-test_user}"
  password: "${POSTGRES_PASSWORD:-}"
  name: "${POSTGRES_DB:-voicebot}"

memory:
  checkpoint_dsn: "${CHECKPOINT_DSN:-}"

observability:
  langsmith:
    enabled: "${LANGSMITH_TRACING:-false}"   # true → export every graph turn to LangSmith
    api_key: "${LANGSMITH_API_KEY:-}"
    project: "${LANGSMITH_PROJECT:-voicebot}"
    endpoint: "${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}"

llm:
  provider: "ollama"
  model: "gemma4:12b"
  verifier_model: "qwen3.5:4b"
  ollama_base_url: "http://localhost:11434"
  think_on_generate: true
  num_ctx: 8192

intent:
  enabled: true

translation:
  provider: "ollama"
  ollama_model: "translategemma:12b"

rag:
  embedding_model: "intfloat/multilingual-e5-large"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  retrieval_threshold: 0.55
  retrieval_gap_threshold: 0.03
  top_k: 5
  retrieval:
    bm25_top_n: 20
    vector_top_n: 20
    rrf_k: 60
    use_reranker: true
    rerank_batch_size: 16
    # Gate thresholds for the no-reranker branch. RRF scores are normalised
    # (top is always 1.0) so they need their own scale - the reranker
    # thresholds above operate on absolute sigmoid scores instead.
    rrf_threshold: 0.5
    rrf_gap_threshold: 0.05
  chunking:
    # .txt uses the sentence-level chunker below; .pdf uses Docling
    strategy: "semantic"          # "semantic" | "paragraph" (.txt only)
    breakpoint_percentile: 90     # cosine-distance percentile that triggers a split
    min_chunk_size: 300           # chars - smaller chunks get merged
    max_chunk_size: 1500          # chars - bigger semantic groups are sub-split
    overlap_sentences: 2          # trailing sentences prepended to next chunk
    docling:                      # layout-aware PDF parse + HybridChunker
      do_ocr: false               # true for scanned / Indic-script PDFs (slower)
      table_mode: "accurate"      # TableFormer: "accurate" | "fast"
      max_tokens: 400             # HybridChunker budget under e5's 512-token limit

stt:
  provider: "indic_conformer"
  decode_strategy: "rnnt"              # rnnt (accurate) | ctc (faster)
  remote_url: "${STT_REMOTE_URL:-http://stt:8002}"    # stt_conformer sidecar URL

tts:
  provider: "indic_parler"
  description: "A clear, calm voice speaks at a natural, moderate pace in a quiet environment. The recording is very high quality, with the voice sounding close-up and natural, with no background noise."
  remote_url: "${TTS_REMOTE_URL:-http://tts:8001}"   # tts_parler sidecar URL

audio:
  cache_ttl_seconds: 3600
  cache_max_files: 1000

# Rationale for every choice here lives in src/evaluation/README.md.
evaluation:
  judge_model: "gemma4:12b"          # Ollama eval LLM (shares llm.ollama_base_url)
  embedding_model: "intfloat/multilingual-e5-large"
  judge_temperature: 0.0
  judge_num_predict: 2048
  judge_reasoning: false             # reasoning judge returns empty content -> invalid JSON
  judge_num_ctx: 8192                # falls back to llm.num_ctx
  sample_strategy: "random"          # "random" | "head" — how --sample-size picks rows
  sample_seed: 42
  run_config:                        # metrics phase (ragas.evaluate)
    timeout: 300                     # per-metric-call timeout (s)
    max_retries: 10                  # retries on a failed/parse judge call
    max_wait: 60                     # max backoff between retries (s)
    max_workers: 4
  testset:
    path: "data/eval/testset.jsonl"
    size: 100
    languages: ["en", "hi", "bn"]    # synthesize Qs in English then translate to vernaculars
    query_distribution:
      simple: 0.5
      reasoning: 0.25
      multi_context: 0.25
    run_config:                        # testset-generation phase (TestsetGenerator)
      timeout: 300
      max_retries: 10
      max_wait: 60
      max_workers: 4
      raise_exceptions: false          # skip+log an unrecoverable node instead of aborting the run
  metrics:
    - context_precision
    - context_recall
    - faithfulness
    - answer_relevancy
    - answer_correctness
    - answer_similarity
  thresholds:
    context_precision: 0.70
    context_recall: 0.70
    faithfulness: 0.80
    answer_relevancy: 0.75
    answer_correctness: 0.60
    answered_rate: 0.70              # min fraction of rows that must produce a grounded answer
  report_dir: "data/eval/reports"
  max_workers: 4
