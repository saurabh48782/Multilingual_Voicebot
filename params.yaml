api:
  host: "${API_HOST:-0.0.0.0}"
  port: "${API_PORT:-8000}"
  debug: "${DEBUG:-false}"

observability:
  langsmith:
    enabled: "${LANGSMITH_TRACING:-false}"   # true → export every graph turn to LangSmith
    api_key: "${LANGSMITH_API_KEY:-}"
    project: "${LANGSMITH_PROJECT:-voicebot}"
    endpoint: "${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}"

llm:
  provider: "ollama"
  model: "gemma4:26b"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "gemma4:26b"
  think_on_generate: true

translation:
  provider: "ollama"
  ollama_model: "translategemma:27b"

rag:
  embedding_model: "intfloat/multilingual-e5-large"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  retrieval_threshold: 0.65
  retrieval_gap_threshold: 0.03
  top_k: 5
  retrieval:
    bm25_top_n: 20
    vector_top_n: 20
    rrf_k: 60
    use_reranker: true
    rerank_batch_size: 16
    # Gate thresholds for the no-reranker branch. RRF scores are normalised
    # (top is always 1.0) so they need their own scale - the reranker
    # thresholds above operate on absolute sigmoid scores instead.
    rrf_threshold: 0.5
    rrf_gap_threshold: 0.05
  chunking:
    strategy: "semantic"          # "semantic" | "paragraph"
    breakpoint_percentile: 90     # cosine-distance percentile that triggers a split
    min_chunk_size: 300           # chars - smaller chunks get merged
    max_chunk_size: 1500          # chars - bigger semantic groups are sub-split
    overlap_sentences: 2          # trailing sentences prepended to next chunk

stt:
  provider: "indic_conformer"
  decode_strategy: "rnnt"              # rnnt (accurate) | ctc (faster)
  remote_url: "${STT_REMOTE_URL:-}"    # stt_conformer sidecar URL (required; compose sets http://stt:8002)

tts:
  provider: "indic_parler"
  description: "A clear, calm voice speaks at a natural, moderate pace in a quiet environment. The recording is very high quality, with the voice sounding close-up and natural, with no background noise."
  remote_url: "${TTS_REMOTE_URL:-}"   # tts_parler sidecar URL (required; compose sets http://tts:8001)
